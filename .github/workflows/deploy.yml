name: Deploy Task 4 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Task_4/package-lock.json

      - name: Install dependencies
        working-directory: Task_4
        run: npm ci

      - name: Build Task 4
        working-directory: Task_4
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Task 4
        uses: actions/upload-pages-artifact@v3
        with:
          path: Task_4/dist

      - name: Deploy Task 4
        id: deployment
        uses: actions/deploy-pages@v4
